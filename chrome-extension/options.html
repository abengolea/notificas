<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Configuración — Notificas LinkedIn Assistant</title>
    <link rel="stylesheet" href="popup.css" />
    <style>
      body { width: 520px; max-width: 100%; }
    </style>
  </head>
  <body>
    <header>
      <h1>CONFIGURACIÓN</h1>
    </header>

    <section class="session">
      <p class="session-title">CONECTADO A NOTIFICAS</p>
      <p>Usuario: <strong id="session-email">Sin sesión</strong></p>
      <p>Entorno: <strong id="session-env">—</strong></p>
      <p>API: <strong id="api-display">—</strong></p>
    </section>

    <div class="field hidden" id="api-override-wrap">
      <label for="apiUrl">URL de Notificas (solo desarrollo)</label>
      <input id="apiUrl" type="url" placeholder="http://localhost:9006" />
      <p class="hint">En la build de producción este campo no se usa. Siempre apunta a https://notificas.com.ar</p>
    </div>

    <div class="field">
      <label for="maxPerSession">Máximo por sesión</label>
      <input id="maxPerSession" type="number" min="1" max="500" value="50" />
    </div>

    <div class="field">
      <label for="locale">Idioma LinkedIn preferido</label>
      <select id="locale">
        <option value="auto">Auto (ES + EN)</option>
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </div>

    <footer class="actions">
      <button type="button" id="save" class="primary">GUARDAR</button>
      <button type="button" id="test" class="secondary">PROBAR CONEXIÓN</button>
      <button type="button" id="reset-session" class="secondary">Reiniciar contador de sesión</button>
      <p id="saved" class="hint hidden">Guardado.</p>
      <p id="test-result" class="hint hidden"></p>
    </footer>

    <script type="module" src="options.js"></script>
  </body>
</html>
